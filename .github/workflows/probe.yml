name: probe-paper-api
on:
  push:
    branches: [ "claude/**" ]
    paths: [ ".github/workflows/probe.yml" ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve paper-api and deps
        run: |
          mkdir p && cd p
          cat > pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>x</groupId><artifactId>x</artifactId><version>1</version>
            <repositories><repository><id>papermc</id><url>https://repo.papermc.io/repository/maven-public/</url></repository></repositories>
            <dependencies><dependency><groupId>io.papermc.paper</groupId><artifactId>paper-api</artifactId><version>26.3.build.152-beta</version></dependency></dependencies>
          </project>
          POM
          mvn -q -B dependency:copy-dependencies -DoutputDirectory=libs -DincludeScope=compile
          ls -la libs
          sha256sum libs/paper-api-*.jar libs/bungeecord-chat-*.jar libs/brigadier-*.jar
      - name: Dump jars
        run: |
          cd p/libs
          for j in paper-api-*.jar; do
            echo "@@BEGIN $j"
            base64 -w 6000 "$j" | sed 's/^/@@ /'
            echo "@@END $j"
            sha256sum "$j"
          done
