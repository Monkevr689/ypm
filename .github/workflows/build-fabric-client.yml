name: Build Fabric client

on:
  push:
    paths:
      - 'fabric-client/**'
      - '.github/workflows/build-fabric-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Show available Fabric versions
        run: |
          echo "--- loader ---";     curl -sS https://meta.fabricmc.net/v2/versions/loader | head -c 400; echo
          echo "--- 26.x game ---";  curl -sS https://meta.fabricmc.net/v2/versions/game | grep -o '"version":"26[^"]*"' | head -20
          echo "--- fabric-api ---"; curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*26[^<]*</version>' | tail -10
          echo "--- loom ---";       curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -8
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ypm-client
          path: fabric-client/build/libs/*.jar
      - name: Dump API signatures (diagnostics on failure)
        if: failure()
        run: |
          MC=$(find ~/.gradle .gradle -name 'minecraft-*26.3*.jar' ! -name '*sources*' 2>/dev/null | grep -Ei 'merged|client' | head -1)
          echo "MC jar: $MC"; find ~/.gradle .gradle -name 'minecraft-*26.3*.jar' 2>/dev/null | head
          for c in com.mojang.blaze3d.platform.InputConstants 'com.mojang.blaze3d.platform.InputConstants$Type' \
                   net.minecraft.client.KeyMapping 'net.minecraft.client.KeyMapping$Category' \
                   net.minecraft.client.Minecraft net.minecraft.client.Gui net.minecraft.client.player.LocalPlayer \
                   net.minecraft.world.entity.player.Player net.minecraft.client.renderer.GameRenderer; do
            echo "=== $c"; javap -cp "$MC" -public "$c" 2>&1 | grep -Eiv 'lambda' | head -120
          done
          echo "=== Entity (filtered)"; javap -cp "$MC" -public net.minecraft.world.entity.Entity | grep -E 'turn|YRot|XRot|getPosition|ViewVector|EyePosition|isInvisible|isSpectator|isAlliedTo|getBoundingBox|position\(' 
          echo "=== LivingEntity (filtered)"; javap -cp "$MC" -public net.minecraft.world.entity.LivingEntity | grep -E 'LineOfSight|DeadOrDying|isAlive'
          echo "=== ClientLevel (filtered)"; javap -cp "$MC" -public net.minecraft.client.multiplayer.ClientLevel | grep -Ei 'entit'
          echo "=== input libs"; find ~/.gradle -name '*.jar' | grep -Ei 'lwjgl|sdl|glfw' | sed 's#.*/##' | sort -u | head -40
          for j in $(find ~/.gradle .gradle -name 'fabric-key*.jar' -o -name 'fabric-lifecycle-events*.jar' 2>/dev/null | grep -v sources | sort -u); do
            echo "=== $j"; unzip -l "$j" | grep -Eo 'net/fabricmc/fabric/api/[^ ]*\.class' | grep -v '\$'
          done
