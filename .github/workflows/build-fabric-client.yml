name: Build Fabric client

on:
  push:
    paths:
      - 'fabric-client/**'
      - '.github/workflows/build-fabric-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Show available Fabric versions
        run: |
          echo "--- loader ---";     curl -sS https://meta.fabricmc.net/v2/versions/loader | head -c 400; echo
          echo "--- 26.x game ---";  curl -sS https://meta.fabricmc.net/v2/versions/game | grep -o '"version":"26[^"]*"' | head -20
          echo "--- fabric-api ---"; curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*26[^<]*</version>' | tail -10
          echo "--- loom ---";       curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -8
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ypm-client
          path: fabric-client/build/libs/*.jar
      - name: Dump API signatures (diagnostics on failure)
        if: failure()
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged-deobf-26.3.jar' | head -1)
          KM=$(find ~/.gradle -name 'fabric-key-mapping-api-v1-*.jar' ! -name '*sources*' | head -1)
          echo "=== KeyMappingHelper"; javap -cp "$KM" -public net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper
          echo "=== Minecraft (filtered)"; javap -cp "$MC" -public net.minecraft.client.Minecraft | grep -Ei 'screen|delta|mouse'
          echo "=== MouseHandler"; javap -cp "$MC" -public net.minecraft.client.MouseHandler | grep -Ei 'grab'
          echo "=== Options (filtered)"; javap -cp "$MC" -public net.minecraft.client.Options | grep -Ei 'keyAttack'
          echo "=== DeltaTracker"; javap -cp "$MC" -public net.minecraft.client.DeltaTracker
          echo "=== InputConstants (filtered)"; javap -cp "$MC" -public com.mojang.blaze3d.platform.InputConstants | grep -Ei 'unknown'
