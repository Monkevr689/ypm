name: Build Fabric client

on:
  push:
    paths:
      - 'fabric-client/**'
      - '.github/workflows/build-fabric-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Show available Fabric versions
        run: |
          echo "--- loader ---";     curl -sS https://meta.fabricmc.net/v2/versions/loader | head -c 400; echo
          echo "--- 26.x game ---";  curl -sS https://meta.fabricmc.net/v2/versions/game | grep -o '"version":"26[^"]*"' | head -20
          echo "--- fabric-api ---"; curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*26[^<]*</version>' | tail -10
          echo "--- loom ---";       curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -8
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ypm-client
          path: fabric-client/build/libs/*.jar
