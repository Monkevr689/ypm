name: Build Fabric client

on:
  push:
    paths:
      - 'fabric-client/**'
      - '.github/workflows/build-fabric-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ypm-client
          path: fabric-client/build/libs/*.jar
      - name: Dump API signatures (temporary)
        if: always()
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged-deobf-26.3.jar' | head -1)
          d() { echo "=== $1"; javap -cp "$MC" -protected "$1" 2>&1 | grep -Ev 'lambda\$' | grep -Ei -- "${2:-.}"; }
          d net.minecraft.client.gui.screens.Screen 'protected|Screen\('
          d net.minecraft.client.gui.components.AbstractSliderButton 'protected|value'
          d 'net.minecraft.client.gui.components.CycleButton$Builder'
          d 'net.minecraft.client.gui.components.CycleButton$OnValueChange'
          d net.minecraft.client.gui.components.CycleButton 'getValue|setValue'
          d net.minecraft.client.gui.GuiGraphicsExtractor 'fill|text|String|outline|guiWidth|guiHeight'
          d net.minecraft.world.item.component.SwingAnimation
          d net.minecraft.world.entity.LivingEntity 'swing'
          d net.minecraft.client.player.LocalPlayer 'swing'
          d 'com.mojang.blaze3d.platform.InputConstants$Key' 'getValue|public'
          d net.minecraft.core.component.DataComponents 'SWING'
          d net.minecraft.world.item.ItemStack 'get\(|getOrDefault'
