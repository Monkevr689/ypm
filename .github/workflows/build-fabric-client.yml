name: Build Fabric client

on:
  push:
    paths:
      - 'fabric-client/**'
      - '.github/workflows/build-fabric-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ypm-client
          path: fabric-client/build/libs/*.jar
      - name: Print jar as base64
        if: success()
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources)
          sha256sum "$JAR"
          echo "----- BEGIN JAR $(basename "$JAR") -----"
          base64 -w 0 "$JAR"; echo
          echo "----- END JAR -----"
