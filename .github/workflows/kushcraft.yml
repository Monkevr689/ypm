name: KushCraft

on:
  push:
    paths:
      - "kushcraft/**"
      - ".github/workflows/kushcraft.yml"
  pull_request:
    paths:
      - "kushcraft/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate resource pack
        working-directory: kushcraft
        run: |
          pip install --quiet pillow
          python3 tools/validate_pack.py

      - name: Build plugin jar
        working-directory: kushcraft
        run: mvn -B -ntp package

      - uses: actions/upload-artifact@v4
        with:
          name: KushCraft-jar
          path: kushcraft/target/KushCraft-*.jar

  server-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/download-artifact@v4
        with:
          name: KushCraft-jar
          path: jar

      - name: Download Paper 26.3
        run: |
          UA="KushCraft-CI (https://github.com/${{ github.repository }})"
          curl -sSf -H "User-Agent: $UA" https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest -o build.json
          jq '{id, channel, file: .downloads["server:default"].name}' build.json
          URL=$(jq -r '.downloads["server:default"].url' build.json)
          mkdir -p server/plugins
          curl -sSfL -H "User-Agent: $UA" "$URL" -o server/paper.jar
          cp jar/KushCraft-*.jar server/plugins/

      - name: Run server with KushCraft
        working-directory: server
        run: |
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nview-distance=4\nsimulation-distance=4\nspawn-protection=0\ngenerate-structures=false\n' > server.properties
          mkfifo console
          java -Xmx2G -jar paper.jar --nogui < console > server.log 2>&1 &
          PID=$!
          exec 3>console
          for i in $(seq 1 240); do grep -q "Done (" server.log && break; sleep 2; done
          grep -q "Done (" server.log || { tail -100 server.log; echo "::error::server did not start"; exit 1; }
          # url: auto -> the pack of this exact version, hosted on GitHub (works on every host)
          for i in $(seq 1 60); do grep -qE "KB at the link|resource pack link" server.log && break; sleep 1; done
          echo "kush selftest" >&3
          sleep 8
          echo "kush strains" >&3
          sleep 2
          # workers on the server's own clock: walk, harvest, plant, carry, dry, buy and sell by themselves
          echo "kush selftest live" >&3
          for i in $(seq 1 180); do grep -qE "LIVETEST (PASS|FAIL)" server.log && break; sleep 1; done
          grep -E "LIVETEST|livetest" server.log || true
          echo "stop" >&3
          timeout 120 tail --pid=$PID -f /dev/null || kill $PID || true
          exec 3>&-
          grep -iE "resource pack" server.log || true
          grep -q "players download it from https://raw.githubusercontent.com/.*/KushCraft-pack-.*\.zip" server.log \
            || { echo "::error::url: auto does not point at the hosted pack"; exit 1; }
          grep -q "(same as this plugin's pack)" server.log \
            || { echo "::error::the pack hosted on GitHub is not the pack this jar builds"; exit 1; }
          if grep -q "Resource pack hosted on port" server.log; then
            echo "::error::built-in web server must not start with url: auto"; exit 1
          fi
          # worker skins are resolved like other client assets: textures/<path>.png
          VJAR=$(find versions -name "*.jar" | head -1)
          echo "vanilla jar: $VJAR"
          unzip -l "$VJAR" | grep -iE "ClientAsset|PlayerSkin" | head -5 || true

      - name: Upgrade an old server (old config, old pack link) to this version
        working-directory: server
        run: |
          # pretend this is an old config (version 6: no new-players / harvest / death /
          # animals sections, the old cheaper shop and ores, the softer market, cartel levels
          # with grow and lab bonuses, the pack on the old GitHub link; from 5.0: a worker
          # limit and short reach, jobs paying, Trade buying things back, a Trade with
          # netherite and End items) and a 2.0 strains.yml (no looks or climates, plus a bred strain)
          python3 - <<'PY'
          lines = open("plugins/KushCraft/config.yml").read().split("\n")
          out, skip, section = [], False, ""
          for l in lines:
              if l and not l[0].isspace() and not l.startswith("#"):
                  section = l.split(":")[0]
                  skip = section in ("new-players", "harvest", "shop", "death", "animals")
              if l.startswith("config-version:"):
                  l = "config-version: 6"
              if section == "workers" and l.startswith("  max-per-player:"):
                  l = "  max-per-player: 4"
              if section == "workers" and l.startswith("  radius:"):
                  l = "  radius: [6, 9, 12]"
              if section == "jobs" and l.startswith("  enabled:"):
                  l = "  enabled: true"
              if section == "exchange" and l.startswith("  enabled:"):
                  l += "\n  sell-ratio: 0.2\n  min-price: 0.8"
              if "{item: glass_bottle, price:" in l and section == "exchange":
                  l += "\n        - {item: netherite_ingot, price: 52000, amount: 1}\n        - {item: elytra, price: 250000, amount: 1}"
              if l.startswith("  demand-drop:"):
                  l = "  demand-drop: 0.004"
              if l.startswith("  url:"):
                  l = "  url: 'https://raw.githubusercontent.com/Monkevr689/ypm/claude/inspiring-keller-65lzp9/kushcraft/release/KushCraft-pack.zip'"
              if "{item: diamond, price:" in l:
                  l = "        - {item: diamond, price: 1500, amount: 1}"
              if "{name: Gang," in l:
                  l = "    - {name: Gang, cost: 10000, members: 6, sell-bonus: 0.03, grow-bonus: 0.05, lab-bonus: 0}"
              if l.startswith("  plants:") or l.startswith("  plant-") or l.startswith("  max-plants") \
                      or l.startswith("  max-near-player"):
                  continue
              if not skip:
                  out.append(l)
          out += [
              "shop:",
              "  seed-price-multiplier: 1.0",
              "  buy:",
              "    - {item: rolling_papers, amount: 8, price: 5}",
              "    - {item: lab_station, amount: 1, price: 400}",
              "  sell:",
              "    bud_dried: 15",
          ]
          open("plugins/KushCraft/config.yml", "w").write("\n".join(out) + "\n")
          open("plugins/KushCraft/strains.yml", "w").write("""strains:
            og_kush:
              name: OG Kush
              type: HYBRID
              color: '#A8E05A'
              potency: 20
              effects: [GIGGLES, MUNCHIES, FOCUS]
              wild-biomes: [forest, plains]
            purple_kush:
              name: Purple Kush
              type: INDICA
              color: '#A45AE8'
              potency: 26
              effects: [COUCH_LOCK, MUNCHIES, EUPHORIA]
              wild-biomes: [dark_forest]
            old_breed:
              name: Old Breed
              type: SATIVA
              color: '#3A8AE8'
              potency: 24
              effects: [ENERGY, FLOATY]
              wild-biomes: []
              creator: 00000000-0000-0000-0000-000000000001
              creator-name: Tester
          """)
          PY
          grep -n "url:\|^config-version" plugins/KushCraft/config.yml
          rm -f console && mkfifo console
          java -Xmx2G -jar paper.jar --nogui < console > server2.log 2>&1 &
          PID=$!
          exec 3>console
          for i in $(seq 1 240); do grep -q "Done (" server2.log && break; sleep 2; done
          grep -q "Done (" server2.log || { tail -100 server2.log; echo "::error::server did not start"; exit 1; }
          for i in $(seq 1 60); do grep -qE "KB at the link|resource pack link" server2.log && break; sleep 1; done
          echo "kush selftest" >&3
          sleep 8
          echo "stop" >&3
          timeout 120 tail --pid=$PID -f /dev/null || kill $PID || true
          exec 3>&-
          grep -iE "kushcraft|resource pack" server2.log || true
          fail() { echo "::error::$1"; exit 1; }
          grep -q "Updated config.yml to version 10" server2.log || fail "config was not upgraded"
          grep -q "Updated strains.yml: 84 new strains" server2.log || fail "strains.yml was not upgraded"
          grep -q "^  url: auto" plugins/KushCraft/config.yml || fail "the old pack link was not switched to auto"
          grep -q "(same as this plugin's pack)" server2.log || fail "the upgraded server does not get the matching pack"
          for section in workers new-players harvest death animals cartel jobs awards; do
            grep -q "^$section:" plugins/KushCraft/config.yml || fail "$section section missing after the upgrade"
          done
          grep -q "^  plants: true" plugins/KushCraft/config.yml || fail "wild plants not added"
          grep -q "item: cook" plugins/KushCraft/config.yml || fail "the Cook is not in the shop"
          grep -q "item: runner" plugins/KushCraft/config.yml || fail "the Runner is not in the shop"
          grep -q "item: supplier" plugins/KushCraft/config.yml || fail "the Supplier is not in the shop"
          grep -q "^    water-price: 2" plugins/KushCraft/config.yml || fail "Supplier settings missing"
          # 6.0: money only from drugs, Trade only sells, no OP PvP / End items, no worker limit
          awk '/^jobs:/{f=1} f && /^  enabled:/{print; exit}' plugins/KushCraft/config.yml | grep -q "false" \
            || fail "jobs still pay"
          grep -q "^  cash-rewards: false" plugins/KushCraft/config.yml || fail "awards still pay cash"
          if grep -qE "sell-ratio|min-price: 0.8" plugins/KushCraft/config.yml; then fail "Trade still buys things back"; fi
          if grep -qE "item: (netherite_ingot|elytra|totem_of_undying|enchanted_golden_apple|ender_pearl|end_stone)" \
              plugins/KushCraft/config.yml; then fail "OP PvP or End items still in Trade"; fi
          grep -q "^    lab:" plugins/KushCraft/config.yml || fail "no Lab Ingredients shelf"
          grep -q "^  max-per-player: 0" plugins/KushCraft/config.yml || fail "worker limit kept"
          # (Bukkit writes the upgraded list one item per line)
          grep -A3 "^  radius:" plugins/KushCraft/config.yml | tr -d ' \n' | grep -qE "radius:(-8-12-16|\[8,12,16\])" \
            || fail "workers did not get their new reach"
          grep -q "^    speed: 50" plugins/KushCraft/config.yml || fail "new drug prices missing"
          if grep -qE "^    seed_pack: [0-9]" plugins/KushCraft/config.yml; then fail "seeds still sell"; fi
          # Bukkit writes lists of maps in block style (item / price / amount on separate lines)
          grep -A3 "item: lab_station" plugins/KushCraft/config.yml | grep -q "price: 650" || fail "new shop prices not written"
          grep -A3 "item: farmhand" plugins/KushCraft/config.yml | grep -q "price: 12000" || fail "workers did not get pricier"
          if grep -A3 "item: lab_station" plugins/KushCraft/config.yml | grep -q "price: 400"; then fail "old shop prices kept"; fi
          grep -A3 "item: diamond$" plugins/KushCraft/config.yml | grep -q "price: 1950" || fail "ores did not get pricier"
          grep -A4 "name: Gang" plugins/KushCraft/config.yml | grep -q "sell-bonus: 0.04" || fail "cartel levels not simplified"
          if grep -q "grow-bonus: 0.05" plugins/KushCraft/config.yml; then fail "old cartel bonuses kept"; fi
          grep -q "^  demand-drop: 0.0025" plugins/KushCraft/config.yml || fail "market not updated"
          grep -q "^  min-price: 0.7" plugins/KushCraft/config.yml || fail "drug prices still crash from mass production"
          grep -q "^  price-step: 0.005" plugins/KushCraft/config.yml || fail "Trade prices not softened"
          grep -q "^  categories:" plugins/KushCraft/config.yml || fail "Trade shelves lost"
          grep -q "^  seconds: 30" plugins/KushCraft/config.yml || fail "drying seconds lost"
          grep -q "^  titles:" plugins/KushCraft/config.yml || fail "leaderboard ranks lost"
          grep -q "^version: 5" plugins/KushCraft/strains.yml || fail "strains.yml version not set"
          grep -q "^  event_horizon:" plugins/KushCraft/strains.yml || fail "Exotic strains not added"
          grep -A10 "^  tiger_kush:" plugins/KushCraft/strains.yml | grep -q "pattern: stripes" || fail "two-tone strains not added"
          grep -q "creator-name: Tester" plugins/KushCraft/strains.yml || fail "bred strain lost"
          grep -q "^  solar_flare:" plugins/KushCraft/strains.yml || fail "new strains not added"
          awk '/^  og_kush:$/{f=1;next} /^  [a-z0-9_]+:$/{f=0} f' plugins/KushCraft/strains.yml > og.txt
          grep -q "color: '#A8E05A'" og.txt || fail "own strain colour was overwritten"
          grep -q "climate:" og.txt || fail "built-in strain did not get its climate"
          grep -q "SELFTEST PASS" server2.log || { grep "selftest failure" server2.log; fail "selftest failed on the upgraded config"; }
          if grep -nE "Exception|Error" server2.log | grep -iE "kushcraft"; then fail "KushCraft errors in the upgrade run"; fi
          echo "Upgrade test passed"

      - name: Run server again hosting the pack itself (url '')
        working-directory: server
        run: |
          sed -i "s#^  url: .*#  url: ''#" plugins/KushCraft/config.yml
          rm -f console && mkfifo console
          java -Xmx2G -jar paper.jar --nogui < console > server3.log 2>&1 &
          PID=$!
          exec 3>console
          for i in $(seq 1 240); do grep -q "Done (" server3.log && break; sleep 2; done
          grep -q "Done (" server3.log || { tail -100 server3.log; echo "::error::server did not start"; exit 1; }
          curl -sSf http://127.0.0.1:8163/KushCraft-test.zip -o pack.zip
          echo "stop" >&3
          timeout 120 tail --pid=$PID -f /dev/null || kill $PID || true
          exec 3>&-
          grep -q "Resource pack hosted on port 8163" server3.log || { echo "::error::built-in pack server did not start"; exit 1; }
          unzip -l pack.zip | tail -3
          unzip -p pack.zip pack.mcmeta
          unzip -l pack.zip | grep -q "assets/kush/items/machine_lab_station.json"
          unzip -l pack.zip | grep -q "assets/kush/items/worker_cook.json"
          unzip -l pack.zip | grep -q "assets/kush/items/worker_runner.json"
          unzip -l pack.zip | grep -q "assets/kush/items/xanny_bars.json"
          unzip -l pack.zip | grep -q "assets/kush/items/worker_supplier.json"
          unzip -l pack.zip | grep -q "assets/kush/textures/item/pattern/stripes_bud_dried_classic.png"
          unzip -l pack.zip | grep -q "assets/kush/textures/item/exotic/void_bud_dried_classic.png"
          unzip -l pack.zip | grep -q "assets/kush/textures/gui/workers.png"
          cmp -s pack.zip plugins/KushCraft/KushCraft-pack.zip || { echo "::error::served zip differs"; exit 1; }
          echo "Built-in pack server test passed"

      - name: Check log
        if: always()
        working-directory: server
        run: |
          grep -iE "kushcraft|selftest" server.log || true
          echo "-----"
          grep -q "KushCraft enabled" server.log || { echo "::error::plugin did not enable"; exit 1; }
          grep -q "SELFTEST PASS" server.log || { echo "::error::selftest failed"; exit 1; }
          grep -q "LIVETEST PASS" server.log || { grep -A12 "LIVETEST" server.log | tail -40; echo "::error::live worker test failed"; exit 1; }
          if grep -qE "Worker skins are not supported|Could not spawn worker mannequins" server.log; then
            echo "::error::worker mannequins or skins do not work"; exit 1
          fi
          if grep -nE "Exception|Error" server.log | grep -iE "kushcraft"; then
            echo "::error::KushCraft errors in log"; exit 1
          fi
          echo "Server test passed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: |
            server/server.log
            server/server2.log
            server/server3.log
