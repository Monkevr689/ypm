name: KushCraft

on:
  push:
    paths:
      - "kushcraft/**"
      - ".github/workflows/kushcraft.yml"
  pull_request:
    paths:
      - "kushcraft/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate resource pack
        working-directory: kushcraft
        run: |
          pip install --quiet pillow
          python3 tools/validate_pack.py

      - name: Build plugin jar
        working-directory: kushcraft
        run: mvn -B -ntp package

      - uses: actions/upload-artifact@v4
        with:
          name: KushCraft-jar
          path: kushcraft/target/KushCraft-*.jar

  server-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/download-artifact@v4
        with:
          name: KushCraft-jar
          path: jar

      - name: Download Paper 26.3
        run: |
          UA="KushCraft-CI (https://github.com/${{ github.repository }})"
          curl -sSf -H "User-Agent: $UA" https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest -o build.json
          jq '{id, channel, file: .downloads["server:default"].name}' build.json
          URL=$(jq -r '.downloads["server:default"].url' build.json)
          mkdir -p server/plugins
          curl -sSfL -H "User-Agent: $UA" "$URL" -o server/paper.jar
          cp jar/KushCraft-*.jar server/plugins/

      - name: Run server with KushCraft
        working-directory: server
        run: |
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nview-distance=4\nsimulation-distance=4\nspawn-protection=0\ngenerate-structures=false\n' > server.properties
          mkfifo console
          java -Xmx2G -jar paper.jar --nogui < console > server.log 2>&1 &
          PID=$!
          exec 3>console
          for i in $(seq 1 240); do grep -q "Done (" server.log && break; sleep 2; done
          grep -q "Done (" server.log || { tail -100 server.log; echo "::error::server did not start"; exit 1; }
          echo "kush selftest" >&3
          sleep 8
          echo "kush strains" >&3
          sleep 2
          curl -sSf http://127.0.0.1:8163/KushCraft-test.zip -o pack.zip
          unzip -l pack.zip | tail -3
          unzip -p pack.zip pack.mcmeta
          unzip -l pack.zip | grep -q "assets/kush/items/machine_lab_station.json"
          echo "stop" >&3
          timeout 120 tail --pid=$PID -f /dev/null || kill $PID || true
          exec 3>&-
          # worker skins are resolved like other client assets: textures/<path>.png
          VJAR=$(find versions -name "*.jar" | head -1)
          echo "vanilla jar: $VJAR"
          unzip -l "$VJAR" | grep -iE "ClientAsset|PlayerSkin" | head -5 || true

      - name: Run server again with an external resource-pack.url
        working-directory: server
        run: |
          # hosted servers often cannot open port 8163: the pack is then hosted elsewhere
          # re-zip it with Python: different zip bytes, same files (like a re-uploaded copy)
          mkdir -p ../host
          python3 - <<'PY'
          import zipfile
          src = zipfile.ZipFile("plugins/KushCraft/KushCraft-pack.zip")
          with zipfile.ZipFile("../host/pack.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=9) as out:
              for n in sorted(src.namelist()):
                  out.writestr(n, src.read(n))
          PY
          cmp -s plugins/KushCraft/KushCraft-pack.zip ../host/pack.zip && echo "zips identical?" || echo "re-zipped copy differs in bytes"
          sha1sum ../host/pack.zip | cut -d' ' -f1 > ../host/sha1.txt
          python3 -m http.server 9000 --directory ../host --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 1
          sed -i "s#^  url: .*#  url: 'http://127.0.0.1:9000/pack.zip'#" plugins/KushCraft/config.yml
          grep -n "url:" plugins/KushCraft/config.yml
          # also pretend this is a 3.0 config (version 6: no workers / new-players /
          # harvest sections, the old cheaper shop, the softer market) and a 2.0
          # strains.yml (no looks or climates, plus a bred strain) to test the upgrade to 4.0
          python3 - <<'PY'
          lines = open("plugins/KushCraft/config.yml").read().split("\n")
          out, skip = [], False
          for l in lines:
              if l and not l[0].isspace() and not l.startswith("#"):
                  skip = l.split(":")[0] in ("workers", "new-players", "harvest", "shop")
              if l.startswith("config-version:"):
                  l = "config-version: 6"
              if l.startswith("  demand-drop:"):
                  l = "  demand-drop: 0.004"
              if not skip:
                  out.append(l)
          out += [
              "shop:",
              "  seed-price-multiplier: 1.0",
              "  buy:",
              "    - {item: rolling_papers, amount: 8, price: 5}",
              "    - {item: lab_station, amount: 1, price: 400}",
              "  sell:",
              "    bud_dried: 15",
          ]
          open("plugins/KushCraft/config.yml", "w").write("\n".join(out) + "\n")
          open("plugins/KushCraft/strains.yml", "w").write("""strains:
            og_kush:
              name: OG Kush
              type: HYBRID
              color: '#A8E05A'
              potency: 20
              effects: [GIGGLES, MUNCHIES, FOCUS]
              wild-biomes: [forest, plains]
            purple_kush:
              name: Purple Kush
              type: INDICA
              color: '#A45AE8'
              potency: 26
              effects: [COUCH_LOCK, MUNCHIES, EUPHORIA]
              wild-biomes: [dark_forest]
            old_breed:
              name: Old Breed
              type: SATIVA
              color: '#3A8AE8'
              potency: 24
              effects: [ENERGY, FLOATY]
              wild-biomes: []
              creator: 00000000-0000-0000-0000-000000000001
              creator-name: Tester
          """)
          PY
          head -5 plugins/KushCraft/strains.yml
          grep -c "^exchange:" plugins/KushCraft/config.yml || true
          rm -f console && mkfifo console
          java -Xmx2G -jar paper.jar --nogui < console > server2.log 2>&1 &
          PID=$!
          exec 3>console
          for i in $(seq 1 240); do grep -q "Done (" server2.log && break; sleep 2; done
          grep -q "Done (" server2.log || { tail -100 server2.log; echo "::error::server did not start"; exit 1; }
          for i in $(seq 1 30); do grep -q "Resource pack: downloaded" server2.log && break; sleep 1; done
          echo "kush selftest" >&3
          sleep 8
          echo "stop" >&3
          timeout 120 tail --pid=$PID -f /dev/null || kill $PID || true
          exec 3>&-
          grep -iE "kushcraft|resource pack" server2.log || true
          grep -q "Resource pack: downloaded .* sha1 $(cat ../host/sha1.txt)" server2.log \
            || { echo "::error::external pack hash not computed correctly"; exit 1; }
          grep -q "(same as this plugin's pack)" server2.log \
            || { echo "::error::re-zipped copy of the same pack was not recognised"; exit 1; }
          if grep -q "Resource pack hosted on port" server2.log; then
            echo "::error::built-in web server must not start when resource-pack.url is set"; exit 1
          fi
          echo "External URL test passed"
          grep -q "Updated config.yml to version 7" server2.log || { echo "::error::config was not upgraded"; exit 1; }
          grep -q "Updated strains.yml: 32 new strains" server2.log || { echo "::error::strains.yml was not upgraded"; exit 1; }
          grep -q "^workers:" plugins/KushCraft/config.yml || { echo "::error::workers section not added"; exit 1; }
          grep -q "^new-players:" plugins/KushCraft/config.yml || { echo "::error::starter kit not added"; exit 1; }
          grep -q "^harvest:" plugins/KushCraft/config.yml || { echo "::error::harvest section not added"; exit 1; }
          grep -q "item: farmhand" plugins/KushCraft/config.yml || { echo "::error::workers not in the shop"; exit 1; }
          # Bukkit writes the shop list in block style (item / amount / price on separate lines)
          grep -A3 "item: lab_station" plugins/KushCraft/config.yml | grep -q "price: 650" \
            || { grep -A3 "item: lab_station" plugins/KushCraft/config.yml; echo "::error::new shop prices not written"; exit 1; }
          if grep -A3 "item: lab_station" plugins/KushCraft/config.yml | grep -q "price: 400"; then
            echo "::error::old shop prices kept"; exit 1
          fi
          grep -q "^  demand-drop: 0.006" plugins/KushCraft/config.yml || { echo "::error::market not updated"; exit 1; }
          grep -q "^cartel:" plugins/KushCraft/config.yml || { echo "::error::cartel section lost"; exit 1; }
          grep -q "^  categories:" plugins/KushCraft/config.yml || { echo "::error::Trade shelves lost"; exit 1; }
          grep -q "^  seconds: 30" plugins/KushCraft/config.yml || { echo "::error::drying seconds lost"; exit 1; }
          grep -q "^  titles:" plugins/KushCraft/config.yml || { echo "::error::leaderboard ranks lost"; exit 1; }
          grep -q "^jobs:" plugins/KushCraft/config.yml || { echo "::error::jobs section lost"; exit 1; }
          grep -q "^awards:" plugins/KushCraft/config.yml || { echo "::error::awards section lost"; exit 1; }
          grep -q "^version: 4" plugins/KushCraft/strains.yml || { echo "::error::strains.yml version not set"; exit 1; }
          grep -q "creator-name: Tester" plugins/KushCraft/strains.yml || { echo "::error::bred strain lost"; exit 1; }
          grep -q "^  solar_flare:" plugins/KushCraft/strains.yml || { echo "::error::new strains not added"; exit 1; }
          awk '/^  og_kush:$/{f=1;next} /^  [a-z0-9_]+:$/{f=0} f' plugins/KushCraft/strains.yml > og.txt
          cat og.txt
          grep -q "color: '#A8E05A'" og.txt || { echo "::error::own strain colour was overwritten"; exit 1; }
          grep -q "climate:" og.txt || { echo "::error::built-in strain did not get its climate"; exit 1; }
          grep -q "SELFTEST PASS" server2.log || { grep "selftest failure" server2.log; echo "::error::selftest failed on the upgraded config"; exit 1; }
          grep -q "url: .*127.0.0.1:9000/pack.zip" plugins/KushCraft/config.yml \
            || { echo "::error::upgrade lost resource-pack.url"; exit 1; }
          if grep -nE "Exception|Error" server2.log | grep -iE "kushcraft"; then
            echo "::error::KushCraft errors in the second run"; exit 1
          fi
          echo "Config upgrade test passed"

      - name: Check log
        if: always()
        working-directory: server
        run: |
          grep -iE "kushcraft|selftest" server.log || true
          echo "-----"
          grep -q "KushCraft enabled" server.log || { echo "::error::plugin did not enable"; exit 1; }
          grep -q "SELFTEST PASS" server.log || { echo "::error::selftest failed"; exit 1; }
          if grep -qE "Worker skins are not supported|Could not spawn worker mannequins" server.log; then
            echo "::error::worker mannequins or skins do not work"; exit 1
          fi
          if grep -nE "Exception|Error" server.log | grep -iE "kushcraft"; then
            echo "::error::KushCraft errors in log"; exit 1
          fi
          echo "Server test passed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: |
            server/server.log
            server/server2.log
