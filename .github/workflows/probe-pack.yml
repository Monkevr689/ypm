name: probe-pack-format
on:
  push:
    paths: [ ".github/workflows/probe-pack.yml" ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Paper version info
        run: |
          UA="probe (https://github.com/${{ github.repository }})"
          curl -sSf -H "User-Agent: $UA" https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest -o b.json
          curl -sSfL -H "User-Agent: $UA" "$(jq -r '.downloads["server:default"].url' b.json)" -o paper.jar
          echo "== outer jar"; unzip -l paper.jar | grep -iE "version|META-INF/versions" | head -20
          unzip -p paper.jar version.json 2>/dev/null && echo || echo "no root version.json"
          mkdir inner && cd inner
          unzip -q -o ../paper.jar 'META-INF/versions/*' 2>/dev/null || true
          for j in $(find . -name '*.jar'); do echo "== $j"; unzip -l "$j" | grep -E " version.json|pack.mcmeta" ; unzip -p "$j" version.json 2>/dev/null; done
          unzip -p ../paper.jar META-INF/MANIFEST.MF | head -20
