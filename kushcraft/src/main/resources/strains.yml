# =====================================================================
#  KushCraft strains
#  Add your own strains here, or let players make them in the Strain Maker
#  (player strains are saved to this file too, marked with "creator").
#
#  type:        SATIVA (likes warm biomes, grows tall)
#               INDICA (likes cold biomes, short and bushy)
#               HYBRID (likes mild biomes)
#  color:       bud colour shown on seeds, buds and the growing plant
#  potency:     5-35 (THC %). Stronger = longer effects + higher price
#  effects:     up to 3 of GIGGLES, MUNCHIES, COUCH_LOCK, ENERGY, EUPHORIA,
#               CREATIVE, FLOATY, PARANOIA, SLEEPY, FOCUS, PAIN_RELIEF, TRIPPY
#  wild-biomes: biomes where breaking grass can drop these seeds
# =====================================================================
