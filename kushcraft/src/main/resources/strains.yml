# =====================================================================
#  KushCraft strains
#  Add your own strains here, or let players breed them in the Drug Lab
#  (bred strains are saved to this file too, marked with "creator").
#
#  type:        SATIVA (tall plant), INDICA (short and bushy) or HYBRID
#  color:       bud colour (seeds, buds and the growing plant)
#  leaf:        leaf colour of the plant and the sugar leaves on buds
#  pistil:      colour of the little hairs on the buds
#  shape:       CLASSIC, FOXTAIL, POPCORN or SPEAR buds
#  pattern:     (optional) a second bud colour: TIPS, STRIPES, SPOTS, MARBLE,
#               SPECKLES, HALO or SPLIT
#  accent:      the colour of that pattern
#  exotic:      (optional) a Mythic look: RAINBOW, GALAXY, GOLDEN, CRYSTAL, NEON,
#               INFERNO, AURORA, TOXIC, SAKURA, PLASMA, BLOOD_MOON, OCEAN, CANDY
#               or an Exotic look: VOID, PRISM, CELESTIAL, PHOENIX, QUANTUM,
#               ECLIPSE. Exotic strains only come from breeding two Mythic
#               strains (never wild, never in the Shop)
#  parents:     (Exotic strains) the two Mythic strains whose cross can give it
#  climate:     where it grows best: TROPICAL, DESERT, TEMPERATE, WETLAND,
#               COLD or MOUNTAIN. Fast + better quality there, slow in the
#               opposite climate (a Grow Lamp fixes that)
#  potency:     5-35 (THC %). Stronger = longer effects + higher price
#  effects:     up to 4 of GIGGLES, MUNCHIES, COUCH_LOCK, ENERGY, EUPHORIA,
#               CREATIVE, FLOATY, PARANOIA, SLEEPY, FOCUS, PAIN_RELIEF, TRIPPY,
#               LUCKY, NIGHT_OWL, AQUATIC, FIREPROOF, GHOST, LOVED_UP, VISIONS,
#               RAGE, DIZZY, GREEN_THUMB, SMOOTH_TALKER, FROSTY, MAGNETIC,
#               SIXTH_SENSE, ZEN
#  flavor:      shown on the seeds and buds
#  price:       Shop price of one seed (leave out: by rarity and potency)
#  shop:        false = not sold in the Shop (find it wild or breed it)
#  wild-biomes: biomes where breaking grass can drop these seeds
#  wild-weight: how often it drops there compared to the others (1 = normal)
# =====================================================================
