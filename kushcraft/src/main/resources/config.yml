# =====================================================================
#  JOBS  (/kush > Jobs)
#  Everyone gets paid for normal work - no need to join. Blocks placed by
#  players never pay, crops must be fully grown, spawner mobs don't count.
# =====================================================================
jobs:
  enabled: true
  # Max money one player can earn from jobs per hour (stops farms printing money).
  hourly-cap: 1500
  # Show "+$0.50 Miner" above the hotbar.
  action-bar: true
  pay:
    miner:
      coal_ore: 0.5
      deepslate_coal_ore: 0.6
      copper_ore: 0.4
      deepslate_copper_ore: 0.5
      iron_ore: 1.0
      deepslate_iron_ore: 1.2
      nether_gold_ore: 0.8
      nether_quartz_ore: 0.6
      gold_ore: 2.0
      deepslate_gold_ore: 2.4
      redstone_ore: 1.0
      deepslate_redstone_ore: 1.2
      lapis_ore: 2.0
      deepslate_lapis_ore: 2.4
      emerald_ore: 10
      deepslate_emerald_ore: 12
      diamond_ore: 15
      deepslate_diamond_ore: 18
      ancient_debris: 40
    farmer:
