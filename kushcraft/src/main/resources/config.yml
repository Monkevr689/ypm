# =====================================================================
#  SHOP  (/kush > Shop or a Dealer Stand)
#  Cannabis seeds: every strain in strains.yml is sold at its own price
#  (rarer, stronger strains cost more). seed-price-multiplier scales them.
#  buy  -> everything else the dealer sells (price per click)
#  sell -> what the dealer pays players. Strain items are multiplied by
#          quality (1-5 stars), potency and rarity, so better weed = more money.
# =====================================================================
shop:
  seed-price-multiplier: 1.25
  # Workers (farmhand, dryer, cook) are listed here too: they show on the hiring board.
  buy:
    - {item: mushroom_spores, amount: 1, price: 30}
    - {item: coca_seeds, amount: 1, price: 50}
    - {item: poppy_seeds, amount: 1, price: 55}
    - {item: peyote_seeds, amount: 1, price: 50}
    - {item: rolling_papers, amount: 8, price: 8}
    - {item: blunt_wrap, amount: 4, price: 12}
    - {item: fertilizer, amount: 4, price: 16}
