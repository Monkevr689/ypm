# =====================================================================
#  KushCraft - grow, cook, roll and deal. 100% server side.
#  Players just type /kush (or right-click the KushCraft Menu item).
# =====================================================================
config-version: 3

# Custom textures/models are delivered with a server resource pack that
# KushCraft builds and hosts by itself. Players get the usual
# "this server uses a resource pack" prompt when they join.
resource-pack:
  enabled: true
  # true = players must accept the pack to stay on the server.
  required: false
  # Port of the small built-in web server that hosts the pack. It must be
  # reachable by players (open it in your firewall / hosting panel).
  port: 8163
  # Public address players use to reach the pack server. Leave empty to use
  # the same address the player typed to join the server (works for most setups).
  host: ''
  # No open port? (Shockbyte and most game hosts only open the game port.)
  # Host the zip somewhere else and paste a DIRECT download link here, e.g.
  #   https://raw.githubusercontent.com/Monkevr689/ypm/claude/inspiring-keller-65lzp9/kushcraft/release/KushCraft-pack.zip
  #   https://www.dropbox.com/s/xxxx/KushCraft-pack.zip?dl=1
  # The zip is also written to plugins/KushCraft/KushCraft-pack.zip on start-up.
  # When set, the built-in web server is not started and the plugin works out
  # the file's hash by itself (so any copy of the zip works). Then /kush reload.
  url: ''
  prompt: '<green><bold>KushCraft</bold></green> <gray>adds custom plants, machines and items. Accept the pack to see them!'

growth:
  # How often plants are updated (seconds).
  tick-seconds: 10
  # Real-time minutes for a cannabis plant to fully mature in average conditions.
  cannabis-minutes: 20
  # Real-time minutes for a magic mushroom cluster to mature.
  mushroom-minutes: 12
  coca-minutes: 16
  poppy-minutes: 14
  # Cannabis needs at least this light level (sun or torches), unless a Grow Lamp is close.
  min-light: 9
  # Grow Lamps boost and light every plant within this many blocks.
  lamp-radius: 6
  # Players can only break plants/machines they could break a block at (protection plugins).
  respect-protection: true

wild:
  # Chance to find wild seeds when breaking grass / ferns / dead bushes.
  # The strain you find depends on the biome!
  grass-seed-chance: 0.04
  # Chance to find mushroom spores when breaking small mushrooms.
  mushroom-spore-chance: 0.12
  # Chance for coca seeds from grass in jungles and savannas.
  coca-seed-chance: 0.03
  # Chance for poppy seeds when breaking a red poppy flower.
  poppy-seed-chance: 0.15

drying:
  # Minutes buds need on the Drug Lab drying shelf.
  minutes: 3

lab:
  # Multiplier for all Drug Lab cooking times (0.5 = twice as fast).
  time-multiplier: 1.0

effects:
  # Show a boss bar with your high level and active effects.
  boss-bar: true
  # Allow screen wobble (nausea) on trippy effects.
  nausea: true
  # High level (0-100+) above which you "green out".
  green-out-at: 100

strain-maker:
  # Players can mix strains from /kush > Strains (otherwise only at a Drug Lab).
  anywhere: true
  # Money it costs to register a new strain (0 = free).
  cost: 150
  # Maximum strains one player can create.
  max-per-player: 25
  # Seed packs you receive for a new strain.
  seeds-given: 3

economy:
  # Use Vault (EssentialsX, CMI, ...) when it is installed. Otherwise KushCraft
  # keeps its own simple wallet per player.
  use-vault: true
  starting-balance: 100
  symbol: '$'

market:
  # Players can open the market from /kush. false = only at a Dealer Stand.
  anywhere: true
  # Every item sold lowers that product's price by this much (0.01 = 1%)...
  demand-drop: 0.01
  # ...down to this fraction of the normal price...
  min-price: 0.5
  # ...and it recovers this much per minute.
  recovery-per-minute: 0.02
  # A random "hot" product sells for extra for a while.
  hot-item-bonus: 1.5
  hot-item-minutes: 60
  # Daily orders: hand in a batch for bonus cash.
  orders: 3
  order-minutes: 60
  order-bonus: 1.75

# Give new players the KushCraft Menu book on their first join.
give-guide-on-first-join: true

menu:
  # Shift + F (sneak + swap hands) opens the /kush menu from anywhere.
  shift-f: true
  # /kush also gives the KushCraft Menu book if the player doesn't have one.
  give-book-on-command: true

# =====================================================================
#  EXCHANGE  (/kush > Exchange)
#  Trade money for vanilla resources and sell them back. price = what a
#  player pays for ONE item; amount = how many one click buys. Players sell
#  for sell-ratio of the price, so nothing can be bought and sold back for a
#  profit. Prices move a little with trading and drift back each minute.
#  Add, remove or re-price anything; categories become tabs (max 7).
# =====================================================================
exchange:
  enabled: true
  sell-ratio: 0.5
  # Price change per "amount" bought (+) or sold (-), 0.01 = 1%...
  price-step: 0.01
  # ...between these limits of the normal price...
  min-price: 0.8
  max-price: 1.25
  # ...and back towards normal this much per minute.
  recovery-per-minute: 0.02
  categories:
    ores:
      name: Ores & Gems
      icon: diamond
      items:
        - {item: coal, price: 3, amount: 16}
