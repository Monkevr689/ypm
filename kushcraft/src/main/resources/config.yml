# =====================================================================
#  RESOURCE PACK
# Custom textures/models come in a server resource pack. Players get the
# usual "this server uses a resource pack" prompt when they join.
resource-pack:
  enabled: true
  # true = players must accept the pack to stay on the server.
  required: false
  # Where players download the pack from:
  #   auto -> the copy of this exact KushCraft version hosted on GitHub.
  #           Works on every host (Shockbyte and most game hosts only open
  #           the game port). Recommended.
  #   ''   -> KushCraft hosts the zip itself on 'port' below (that port
  #           must be open to players).
  #   a direct link to a zip you host yourself, e.g. Dropbox with ?dl=1.
  #           plugins/KushCraft/KushCraft-pack.zip is written on start-up.
  # The plugin works out the file's hash by itself. Then /kush reload.
  url: auto
  # Only used when url is ''.
  port: 8163
  # Public address for the built-in pack server. Empty = the address the
  # player typed to join.
  host: ''
  prompt: '<green><bold>KushCraft</bold></green> <gray>adds custom plants, machines and items. Accept the pack to see them!'

# =====================================================================
#  TRADE  (/kush > Trade)
#  Spend the money from your product on vanilla items. Trade only SELLS:
#  you can't sell anything back here - money only comes from drugs. No
#  netherite, totems, golden apples, ender pearls or End items.
#  9.0: price-multiplier 5.0 (everything 5x the 8.0 price).
#  Up to 18 shelves (row 1 and row 5 of the page) of up to 27 items each.
#  An item may be on more than one shelf. price = what a player pays for ONE
#  item (before price-multiplier), amount = how many one click buys
#  (shift-click buys 4 times as many).
# =====================================================================
exchange:
  enabled: true
  # All prices below are multiplied by this.
  price-multiplier: 5.0
  # Price change per "amount" bought, 0.01 = 1%...
  price-step: 0.01
  # ...up to this much of the normal price...
  max-price: 1.25
  # ...and back towards normal this much per minute.
  recovery-per-minute: 0.02
  categories:
    lab:
      name: Lab Ingredients
      icon: brewing_stand
      items:
        - {item: glass_bottle, price: 6, amount: 16}
        - {item: paper, price: 6, amount: 16}
        - {item: sugar, price: 8, amount: 16}
        - {item: wheat, price: 4, amount: 16}
        - {item: cocoa_beans, price: 10, amount: 16}
        - {item: glow_berries, price: 25, amount: 16}
        - {item: vine, price: 5, amount: 16}
        - {item: bone_meal, price: 6, amount: 32}
        - {item: white_dye, price: 8, amount: 16}
        - {item: pink_dye, price: 10, amount: 16}
        - {item: purple_dye, price: 12, amount: 16}
        - {item: lapis_lazuli, price: 40, amount: 16}
        - {item: redstone, price: 20, amount: 16}
        - {item: glowstone_dust, price: 30, amount: 16}
        - {item: gunpowder, price: 45, amount: 16}
        - {item: nether_wart, price: 30, amount: 16}
        - {item: honey_bottle, price: 40, amount: 4}
        - {item: slime_ball, price: 60, amount: 8}
        - {item: iron_nugget, price: 13, amount: 16}
        - {item: glass_pane, price: 5, amount: 16}
    ores:
      name: Ores & Gems
      icon: diamond
      items:
        - {item: coal, price: 32, amount: 16}
