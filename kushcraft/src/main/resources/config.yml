# =====================================================================
#  KushCraft - grow, cook, roll and deal. 100% server side.
#  Players just type /kush (or right-click the KushCraft Menu item).
# =====================================================================
config-version: 5

# Custom textures/models are delivered with a server resource pack that
# KushCraft builds and hosts by itself. Players get the usual
# "this server uses a resource pack" prompt when they join.
resource-pack:
  enabled: true
  # true = players must accept the pack to stay on the server.
  required: false
  # Port of the small built-in web server that hosts the pack. It must be
  # reachable by players (open it in your firewall / hosting panel).
  port: 8163
  # Public address players use to reach the pack server. Leave empty to use
  # the same address the player typed to join the server (works for most setups).
  host: ''
  # No open port? (Shockbyte and most game hosts only open the game port.)
  # Host the zip somewhere else and paste a DIRECT download link here, e.g.
  #   https://raw.githubusercontent.com/Monkevr689/ypm/claude/inspiring-keller-65lzp9/kushcraft/release/KushCraft-pack.zip
  #   https://www.dropbox.com/s/xxxx/KushCraft-pack.zip?dl=1
  # The zip is also written to plugins/KushCraft/KushCraft-pack.zip on start-up.
  # When set, the built-in web server is not started and the plugin works out
  # the file's hash by itself (so any copy of the zip works). Then /kush reload.
  url: ''
  prompt: '<green><bold>KushCraft</bold></green> <gray>adds custom plants, machines and items. Accept the pack to see them!'

growth:
  # How often plants are updated (seconds).
  tick-seconds: 10
  # Real-time minutes for a cannabis plant to fully mature in average conditions.
  cannabis-minutes: 20
  # Real-time minutes for a magic mushroom cluster to mature.
  mushroom-minutes: 12
  coca-minutes: 16
  poppy-minutes: 14
  peyote-minutes: 18
  # Cannabis needs at least this light level (sun or torches), unless a Grow Lamp is close.
  min-light: 9
  # Grow Lamps boost and light every plant within this many blocks.
  lamp-radius: 6
  # Players can only break plants/machines they could break a block at (protection plugins).
  respect-protection: true

wild:
  # Chance to find wild seeds when breaking grass / ferns / dead bushes.
  # The strain you find depends on the biome!
  grass-seed-chance: 0.04
  # Chance to find mushroom spores when breaking small mushrooms.
  mushroom-spore-chance: 0.12
  # Chance for coca seeds from grass in jungles and savannas.
  coca-seed-chance: 0.03
  # Chance for poppy seeds when breaking a red poppy flower.
  poppy-seed-chance: 0.15
  # Chance for peyote seeds from dead bushes in deserts and badlands.
  peyote-seed-chance: 0.08

drying:
  # Minutes buds need on the Drug Lab drying shelf.
  minutes: 3

lab:
  # Multiplier for all Drug Lab cooking times (0.5 = twice as fast).
  time-multiplier: 1.0
  # Price of each Drug Lab upgrade (level 2, 3, 4, 5). Every level cooks
  # 15% faster and adds 8% chance of a bonus item.
  upgrade-costs: [2500, 7500, 20000, 50000]

effects:
  # Show a boss bar with your high level and active effects.
  boss-bar: true
  # Allow screen wobble (nausea) on trippy effects.
  nausea: true
  # High level (0-100+) above which you "green out".
  green-out-at: 100
  # Chance that a natural ore drops double while you have the Lucky effect.
  lucky-double-chance: 0.2

strain-maker:
  # Money every mix costs (Drug Lab > Mix; the result is random: keep it or try again).
  cost: 250
  # Maximum strains one player can create.
  max-per-player: 25
  # Seed packs you receive for a new strain.
  seeds-given: 3

economy:
  # Use Vault (EssentialsX, CMI, ...) when it is installed. Otherwise KushCraft
  # keeps its own simple wallet per player.
  use-vault: true
  starting-balance: 250
  symbol: '$'

market:
  # Players can open the market from /kush. false = only at a Dealer Stand.
  anywhere: true
  # Every item sold lowers that product's price by this much (0.01 = 1%)...
  demand-drop: 0.004
  # ...down to this fraction of the normal price...
  min-price: 0.5
  # ...and it recovers this much per minute.
  recovery-per-minute: 0.03
  # A random "hot" product sells for extra for a while.
  hot-item-bonus: 1.5
  hot-item-minutes: 60
  # Daily orders: hand in a batch for bonus cash.
  orders: 3
  order-minutes: 60
  order-bonus: 1.5

# =====================================================================
#  DEALER RANKS - the players who sold the most product (lifetime Shop
#  sales + orders) get these titles. top: 5 = every place up to #5 that a
#  title above didn't take. bonus = extra money on every sale (0.10 = +10%).
#  Titles change hands the moment someone sells more.
# =====================================================================
ranks:
  titles:
    - {top: 1, name: Cartel Boss, color: dark_red, bonus: 0.15}
    - {top: 2, name: Kingpin, color: red, bonus: 0.12}
    - {top: 3, name: The Plug, color: gold, bonus: 0.10}
    - {top: 5, name: Supplier, color: light_purple, bonus: 0.07}
    - {top: 10, name: Hustler, color: aqua, bonus: 0.05}
    - {top: 25, name: Dealer, color: green, bonus: 0.02}
  everyone: {name: Street Seller, color: gray, bonus: 0}
  # Show the title in front of the player's name in the tab list.
  tab-list: true

awards:
  # Achievements are also real advancements (their own tab, with the usual
  # toast). false = show them as a title on screen instead.
  advancements: true

# Give new players the KushCraft Menu book on their first join.
give-guide-on-first-join: true

menu:
  # Shift + F (sneak + swap hands) opens the /kush menu from anywhere.
  shift-f: true
  # /kush also gives the KushCraft Menu book if the player doesn't have one.
  give-book-on-command: true

# =====================================================================
#  TRADE  (/kush > Trade)
#  Swap the money from your product for vanilla resources. Resources are
#  expensive on purpose: you have to sell a LOT of product for a diamond.
#  price = what a player pays for ONE item, amount = how many one click
#  buys (shift-click buys 4 times as many). Players sell resources back for
#  sell-ratio of the price. Max 36 items (one page).
# =====================================================================
exchange:
  enabled: true
  # All prices below are multiplied by this.
  price-multiplier: 1.0
  sell-ratio: 0.2
  # Price change per "amount" bought (+) or sold (-), 0.01 = 1%...
  price-step: 0.01
  # ...between these limits of the normal price...
  min-price: 0.8
  max-price: 1.25
  # ...and back towards normal this much per minute.
  recovery-per-minute: 0.02
  items:
    # ores & gems
    - {item: coal, price: 25, amount: 16}
    - {item: copper_ingot, price: 20, amount: 16}
    - {item: iron_ingot, price: 80, amount: 8}
    - {item: gold_ingot, price: 150, amount: 8}
    - {item: redstone, price: 15, amount: 16}
    - {item: lapis_lazuli, price: 30, amount: 16}
    - {item: emerald, price: 600, amount: 1}
    - {item: diamond, price: 1500, amount: 1}
    - {item: netherite_ingot, price: 40000, amount: 1}
    # lab supplies
    - {item: sugar, price: 8, amount: 16}
    - {item: glass_bottle, price: 6, amount: 16}
    - {item: paper, price: 6, amount: 16}
    - {item: pink_dye, price: 10, amount: 16}
    - {item: purple_dye, price: 12, amount: 16}
    - {item: nether_wart, price: 30, amount: 16}
    - {item: glow_berries, price: 25, amount: 16}
    - {item: glowstone_dust, price: 30, amount: 16}
    - {item: blaze_powder, price: 120, amount: 8}
    # blocks
    - {item: oak_log, price: 20, amount: 16}
    - {item: spruce_log, price: 20, amount: 16}
    - {item: stone, price: 4, amount: 64}
    - {item: cobblestone, price: 2, amount: 64}
    - {item: glass, price: 10, amount: 16}
    - {item: sand, price: 3, amount: 64}
    - {item: white_wool, price: 25, amount: 16}
    - {item: quartz, price: 35, amount: 16}
    - {item: obsidian, price: 120, amount: 8}
    # food & mob drops
    - {item: bread, price: 20, amount: 16}
    - {item: cooked_beef, price: 40, amount: 16}
    - {item: golden_carrot, price: 120, amount: 8}
    - {item: bone_meal, price: 6, amount: 32}
    - {item: gunpowder, price: 45, amount: 16}
    - {item: slime_ball, price: 60, amount: 8}
    - {item: ender_pearl, price: 250, amount: 4}
    - {item: experience_bottle, price: 200, amount: 8}
    - {item: golden_apple, price: 2000, amount: 1}

# =====================================================================
#  JOBS
#  Everyone gets paid a little for normal work - no need to join. Blocks
#  placed by players never pay, crops must be fully grown, spawner mobs
#  don't count. Shown above the hotbar.
# =====================================================================
jobs:
  enabled: true
  # Max money one player can earn from jobs per hour (stops farms printing money).
  hourly-cap: 750
  # All pay below is multiplied by this.
  pay-multiplier: 0.5
  # Show "+$0.50 Miner" above the hotbar.
  action-bar: true
  pay:
    miner:
      coal_ore: 0.5
      deepslate_coal_ore: 0.6
      copper_ore: 0.4
      deepslate_copper_ore: 0.5
      iron_ore: 1.0
      deepslate_iron_ore: 1.2
      nether_gold_ore: 0.8
      nether_quartz_ore: 0.6
      gold_ore: 2.0
      deepslate_gold_ore: 2.4
      redstone_ore: 1.0
      deepslate_redstone_ore: 1.2
      lapis_ore: 2.0
      deepslate_lapis_ore: 2.4
      emerald_ore: 10
      deepslate_emerald_ore: 12
      diamond_ore: 15
      deepslate_diamond_ore: 18
      ancient_debris: 40
    farmer:
