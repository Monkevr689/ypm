# =====================================================================
#  JOBS
#  Everyone gets paid a little for normal work - no need to join. Blocks
#  placed by players never pay, crops must be fully grown, spawner mobs
#  don't count. Shown above the hotbar.
# =====================================================================
jobs:
  enabled: true
  # Max money one player can earn from jobs per hour (stops farms printing money).
  hourly-cap: 750
  # All pay below is multiplied by this.
  pay-multiplier: 0.5
  # Show "+$0.50 Miner" above the hotbar.
  action-bar: true
  pay:
    miner:
      coal_ore: 0.5
      deepslate_coal_ore: 0.6
      copper_ore: 0.4
      deepslate_copper_ore: 0.5
      iron_ore: 1.0
      deepslate_iron_ore: 1.2
      nether_gold_ore: 0.8
      nether_quartz_ore: 0.6
      gold_ore: 2.0
      deepslate_gold_ore: 2.4
      redstone_ore: 1.0
      deepslate_redstone_ore: 1.2
      lapis_ore: 2.0
      deepslate_lapis_ore: 2.4
      emerald_ore: 10
      deepslate_emerald_ore: 12
      diamond_ore: 15
      deepslate_diamond_ore: 18
      ancient_debris: 40
    farmer:
      wheat: 0.15
      carrots: 0.15
      potatoes: 0.15
      beetroots: 0.15
      nether_wart: 0.2
      cocoa: 0.2
      melon: 0.3
      pumpkin: 0.3
      sugar_cane: 0.05
      cactus: 0.05
    woodcutter:
