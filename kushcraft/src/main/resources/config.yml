    - {item: seed_pack, strain: northern_lights, amount: 1, price: 60}
    - {item: seed_pack, strain: purple_kush, amount: 1, price: 70}
    - {item: seed_pack, strain: sour_diesel, amount: 1, price: 90}
    - {item: seed_pack, strain: white_widow, amount: 1, price: 110}
    - {item: mushroom_spores, amount: 1, price: 45}
    - {item: rolling_papers, amount: 8, price: 10}
    - {item: blunt_wrap, amount: 4, price: 16}
    - {item: fertilizer, amount: 4, price: 20}
    - {item: bong, amount: 1, price: 120}
    - {item: lab_solvent, amount: 2, price: 50}
    - {item: catalyst, amount: 2, price: 70}
    - {item: grower_guide, amount: 1, price: 0}
    - {item: planter_box, amount: 1, price: 60}
    - {item: drying_rack, amount: 1, price: 150}
    - {item: rolling_table, amount: 1, price: 200}
