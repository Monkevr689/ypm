# =====================================================================
#  KushCraft - grow, cook, roll and deal. 100% server side.
#  Players just type /kush (or right-click the KushCraft Menu item).
# =====================================================================
config-version: 8

# Custom textures/models come in a server resource pack. Players get the
# usual "this server uses a resource pack" prompt when they join.
resource-pack:
  enabled: true
  # true = players must accept the pack to stay on the server.
  required: false
  # Where players download the pack from:
  #   auto -> the copy of this exact KushCraft version hosted on GitHub.
  #           Works on every host (Shockbyte and most game hosts only open
  #           the game port). Recommended.
  #   ''   -> KushCraft hosts the zip itself on 'port' below (that port
  #           must be open to players).
  #   a direct link to a zip you host yourself, e.g. Dropbox with ?dl=1.
  #           plugins/KushCraft/KushCraft-pack.zip is written on start-up.
  # The plugin works out the file's hash by itself. Then /kush reload.
  url: auto
  # Only used when url is ''.
  port: 8163
  # Public address for the built-in pack server. Empty = the address the
  # player typed to join.
  host: ''
  prompt: '<green><bold>KushCraft</bold></green> <gray>adds custom plants, machines and items. Accept the pack to see them!'

growth:
  # How often plants are updated (seconds).
  tick-seconds: 10
  # Real-time minutes for a cannabis plant to fully mature in average conditions.
  cannabis-minutes: 20
  # Real-time minutes for a magic mushroom cluster to mature.
  mushroom-minutes: 12
  coca-minutes: 16
  poppy-minutes: 14
  peyote-minutes: 18
  # Cannabis needs at least this light level (sun or torches), unless a Grow Lamp is close.
  min-light: 9
  # Grow Lamps boost and light every plant within this many blocks.
  lamp-radius: 6
  # Players can only break plants/machines they could break a block at (protection plugins).
  respect-protection: true

wild:
  # Chance to find wild seeds when breaking grass / ferns / dead bushes.
  # The strain you find depends on the biome!
  grass-seed-chance: 0.04
  # Chance to find mushroom spores when breaking small mushrooms.
  mushroom-spore-chance: 0.12
  # Chance for coca seeds from grass in jungles and savannas.
  coca-seed-chance: 0.03
  # Chance for poppy seeds when breaking a red poppy flower.
  poppy-seed-chance: 0.15
  # Chance for peyote seeds from dead bushes in deserts and badlands.
  peyote-seed-chance: 0.08
  # Chance to find ergot (the fungus LSD is made from) when breaking ripe wheat.
  # It can also be cooked from wheat at a Drug Lab.
  ergot-chance: 0.06
  # Wild plants grow by themselves out in the world, 20-56 blocks from
  # players: cannabis strains by biome, coca in jungles and savannas, poppies
  # on plains, peyote in deserts, magic mushrooms in dark forests and swamps.
  # Anyone can pick them (buds and seeds!). Never near someone's farm.
  plants: true
  # One spot near every player is tried this often (seconds).
  plant-seconds: 45
  # Most wild plants on the whole server, and around one player.
  max-plants: 80
  max-near-player: 6
  # Unpicked wild plants wither after this many hours.
  plant-hours: 6

# Right-click an animal with a joint, an edible or any drug: its eyes go
# red and it gets high (slow, or the zoomies on uppers) for a while.
animals:
  enabled: true
  seconds: 90

drying:
  # Seconds fresh buds need on a drying rack (every Drug Lab has 5 racks).
  seconds: 30

lab:
  # Multiplier for all Drug Lab cooking times (0.5 = twice as fast).
  time-multiplier: 1.0
  # Price of each Drug Lab upgrade (level 2, 3, 4, 5). Every level cooks
  # 15% faster and adds 8% chance of a bonus item.
  upgrade-costs: [2500, 8000, 20000, 50000]

effects:
  # Show a boss bar with your high level and active effects.
  boss-bar: true
  # Allow screen wobble (nausea) on trippy effects.
  nausea: true
  # High level (0-100+) above which you "green out".
  green-out-at: 100
  # Chance that a natural ore drops double while you have the Lucky effect.
  lucky-double-chance: 0.2

strain-maker:
  # Money every mix costs (Drug Lab > Mix; the result is random: keep it or try again).
  cost: 250
  # Maximum strains one player can create.
  max-per-player: 25
  # Seed packs you receive for a new strain.
  seeds-given: 3

economy:
  # Use Vault (EssentialsX, CMI, ...) when it is installed. Otherwise KushCraft
  # keeps its own simple wallet per player.
  use-vault: true
  starting-balance: 250
  symbol: '$'

market:
  # Players can open the market from /kush. false = only at a Dealer Stand.
  anywhere: true
  # Every item sold lowers that product's price by this much (0.01 = 1%),
  # even inside one big sale, so dumping 200 of one thing pays less...
  demand-drop: 0.006
  # ...down to this fraction of the normal price...
  min-price: 0.4
  # ...and it recovers this much per minute. Sell a mix of products!
  recovery-per-minute: 0.025
  # A random "hot" product sells for extra for a while.
  hot-item-bonus: 1.5
  hot-item-minutes: 60
  # Daily orders: hand in a batch for bonus cash.
  orders: 3
  order-minutes: 60
  order-bonus: 1.5

# =====================================================================
#  DEALER RANKS - the players who sold the most product (lifetime Shop
#  sales + orders) get these titles. top: 5 = every place up to #5 that a
#  title above didn't take. bonus = extra money on every sale (0.10 = +10%).
#  Titles change hands the moment someone sells more.
# =====================================================================
ranks:
  titles:
    - {top: 1, name: Cartel Boss, color: dark_red, bonus: 0.15}
    - {top: 2, name: Kingpin, color: red, bonus: 0.12}
    - {top: 3, name: The Plug, color: gold, bonus: 0.10}
    - {top: 5, name: Supplier, color: light_purple, bonus: 0.07}
    - {top: 10, name: Hustler, color: aqua, bonus: 0.05}
    - {top: 25, name: Dealer, color: green, bonus: 0.02}
  everyone: {name: Street Seller, color: gray, bonus: 0}
  # Show the title in front of the player's name in the tab list.
  tab-list: true

awards:
  # Achievements are also real advancements (their own tab, with the usual
  # toast). false = show them as a title on screen instead.
  advancements: true

# =====================================================================
#  CARTELS  (/kush > Cartel)
#  A cartel is a team: a shared bank (a cut of every member's sale goes
#  in), levels bought from the bank (more members, better prices for
#  everyone) and big shipments to fill together. The best cartels are on
#  the Top Dealers page.
# =====================================================================
cartel:
  enabled: true
  # Price to start a cartel.
  create-cost: 2500
  max-name-length: 16
  # Every member sale adds this much on top into the cartel bank (0.05 = 5%).
  bank-cut: 0.05
  # Contracts filled by a member add this much of the reward to the bank.
  contract-cut: 0.10
  # Shipments: about this much product per level (paid normally to whoever
  # delivers), plus reward = value x shipment-bonus into the bank when done.
  shipment-value: 6000
  shipment-bonus: 1.5
  shipment-hours: 24
  shipment-cooldown-minutes: 30
  # Levels: cost comes out of the cartel bank. members = max members,
  # sell-bonus = better prices for every member. (grow-bonus and lab-bonus
  # also work if you want them: faster plants / Drug Labs for members.)
  levels:
    - {name: Crew, cost: 0, members: 4, sell-bonus: 0}
    - {name: Gang, cost: 10000, members: 6, sell-bonus: 0.04}
    - {name: Syndicate, cost: 40000, members: 8, sell-bonus: 0.08}
    - {name: Cartel, cost: 120000, members: 12, sell-bonus: 0.12}
    - {name: Empire, cost: 350000, members: 16, sell-bonus: 0.16}

# Give new players the KushCraft Menu book on their first join.
give-guide-on-first-join: true

new-players:
  # Given once on the first join, together with the menu book.
  starter-kit:
    - {item: seed_pack, strain: og_kush, amount: 2}
    - {item: fertilizer, amount: 2}

harvest:
  # Harvested buds, seeds and leaves go straight into your inventory
  # (whatever doesn't fit drops). false = they drop on the ground.
  to-inventory: true
  # Sneak + right-click a ripe plant to harvest every ripe plant of yours
  # within this many blocks. 0 = off.
  sneak-radius: 4
  # Tell players in the action bar when their plants are ready.
  ripe-notice: true

# =====================================================================
#  WORKERS  (Shop > Gear & Workers)
#  Hire people who work for you. They're expensive, but they never stop:
#   Farmhand - harvests your ripe plants and plants a seed from the harvest
#              again (and plants / fertilizes from their satchel)
#   Dryer    - hangs fresh buds on your Drug Lab racks and collects them dry
#   Cook     - cooks the drug you pick at your Drug Lab, from what's in their
#              satchel (and takes dried buds from your Dryers)
#  They only touch the plants and labs of the player who hired them.
#  Right-click a worker for their satchel and buttons.
# =====================================================================
workers:
  enabled: true
  # Most workers one player can have (admins: no limit).
  max-per-player: 4
  # Per level (1, 2, 3): how far from where they stand they work, and the
  # seconds they rest between jobs.
  radius: [6, 9, 12]
  rest-seconds: [6, 4, 2]
  # Price to train a worker to level 2 and 3.
  upgrade-costs: [10000, 25000]
  # Wage for every job (one harvest, one planting, one trip to the racks,
  # one batch cooked), paid from the owner's wallet. No money = no work.
  farmhand:
    wage: 5
  dryer:
    wage: 4
  cook:
    wage: 8

# Dying costs you this much of the cash in your wallet (0.2 = 20%).
# The money is gone - nobody gets it, so killing players doesn't pay.
death:
  cash-lost: 0.2

menu:
  # Shift + F (sneak + swap hands) opens the /kush menu from anywhere.
  shift-f: true
  # /kush also gives the KushCraft Menu book if the player doesn't have one.
  give-book-on-command: true

# =====================================================================
#  TRADE  (/kush > Trade)
#  Swap the money from your product for vanilla resources. Resources are
#  expensive on purpose: you have to sell a LOT of product for a diamond.
#  Up to 7 shelves (categories) of up to 27 items each.
#  price = what a player pays for ONE item, amount = how many one click
#  buys (shift-click buys 4 times as many). Players sell resources back for
#  sell-ratio of the price.
# =====================================================================
exchange:
  enabled: true
  # All prices below are multiplied by this.
  price-multiplier: 1.0
  sell-ratio: 0.2
  # Price change per "amount" bought (+) or sold (-), 0.01 = 1%...
  price-step: 0.01
  # ...between these limits of the normal price...
  min-price: 0.8
  max-price: 1.25
  # ...and back towards normal this much per minute.
  recovery-per-minute: 0.02
  categories:
