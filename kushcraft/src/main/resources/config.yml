# =====================================================================
#  JOBS  (off: money only comes from selling drugs)
#  true = everyone also gets paid a little for normal work (mining,
#  farming, woodcutting, hunting). Blocks placed by players never pay,
#  crops must be fully grown, spawner mobs don't count.
# =====================================================================
jobs:
  enabled: false
  # Max money one player can earn from jobs per hour (stops farms printing money).
  hourly-cap: 750
  # All pay below is multiplied by this.
  pay-multiplier: 0.5
  # Show "+$0.50 Miner" above the hotbar.
  action-bar: true
  pay:
    miner:
      coal_ore: 0.5
      deepslate_coal_ore: 0.6
      copper_ore: 0.4
      deepslate_copper_ore: 0.5
      iron_ore: 1.0
      deepslate_iron_ore: 1.2
      nether_gold_ore: 0.8
      nether_quartz_ore: 0.6
      gold_ore: 2.0
      deepslate_gold_ore: 2.4
      redstone_ore: 1.0
      deepslate_redstone_ore: 1.2
      lapis_ore: 2.0
      deepslate_lapis_ore: 2.4
      emerald_ore: 10
      deepslate_emerald_ore: 12
      diamond_ore: 15
      deepslate_diamond_ore: 18
      ancient_debris: 40
    farmer:
      wheat: 0.15
      carrots: 0.15
      potatoes: 0.15
      beetroots: 0.15
      nether_wart: 0.2
      cocoa: 0.2
      melon: 0.3
      pumpkin: 0.3
      sugar_cane: 0.05
      cactus: 0.05
    woodcutter:
      # every kind of log and nether stem
      logs: 0.2
    hunter:
      zombie: 1.0
      zombie_villager: 1.0
      husk: 1.0
      drowned: 1.2
      skeleton: 1.0
      stray: 1.2
      bogged: 1.2
      spider: 1.0
      cave_spider: 1.0
      creeper: 1.5
      slime: 0.5
      magma_cube: 0.5
      silverfish: 0.3
      endermite: 0.3
      phantom: 2.0
      enderman: 2.0
      witch: 3.0
      pillager: 2.0
      vindicator: 3.0
      vex: 1.0
      evoker: 8.0
      ravager: 10.0
      guardian: 2.0
      elder_guardian: 30
      blaze: 3.0
      ghast: 4.0
      hoglin: 2.0
      zoglin: 2.0
      piglin_brute: 5.0
      wither_skeleton: 4.0
