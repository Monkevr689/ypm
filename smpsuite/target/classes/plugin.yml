name: SMPSuite
version: 1.0.0
main: dev.smpsuite.SMPSuite
api-version: '1.21.4'
description: Skills with capped bonuses and jobs pay, skill abilities, Bliss gems, opt-in teams and voice chat groups for a survival-first SMP.
author: SMPSuite
softdepend: [Vault, KushCraft, voicechat]
commands:
  skills:
    description: Your skills, bonuses and abilities
    usage: /skills [player] | /skills top <skill>
    aliases: [skill, sk]
  gem:
    description: Your Bliss gem
    usage: /gem [use primary|secondary | recover | reroll | pockets]
    aliases: [gems]
  party:
    description: Teams (parties) - opt-in groups with a shared colour and tag
    usage: /party help
    aliases: [teams, pt]
  tc:
    description: Send a message to your team
    usage: /tc <message>
  vc:
    description: Voice chat groups (needs Simple Voice Chat)
    usage: /vc [join <channel> | leave | team]
    aliases: [voice]
  smp:
    description: SMPSuite admin
    usage: /smp help
permissions:
  smpsuite.use:
    description: Skills, gems, teams and voice commands
    default: true
  smpsuite.admin:
    description: Admin commands (levels, gems, energy, reload, selftest)
    default: op
