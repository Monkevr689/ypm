# =====================================================================
#  SMPSuite - a survival-first SMP: skills are the main progression,
#  Bliss gems add flavour, teams and voice chat are social tools.
#  Nothing here should let one player dominate PvP or the economy.
# =====================================================================
config-version: 1

# =====================================================================
#  SKILLS
#  Mining, Farming, Fishing, Foraging, Excavation and Combat level up from
#  normal survival play. Vitality levels up from all of it (a share of the
#  XP you earn everywhere else) and gives extra hearts.
#  XP for level L -> L+1 = base * (L+1) ^ exponent * the skill's multiplier.
#  With the defaults a skill reaches level 10 after ~2 hours of that
#  activity, 25 after ~15 hours and 50 after ~60 hours.
# =====================================================================
skills:
  enabled: true
  max-level: 50
  curve:
    base: 40
    exponent: 1.1
  # Combat-related skills level slower than the rest (the server is PvP-light).
  curve-multiplier:
    combat: 1.5
    vitality: 2.0
  # Vitality gets this share of every bit of XP earned in the other skills.
  vitality-share: 0.15
  # ...plus this much for every heart you regenerate naturally (by eating well).
  vitality-per-heart-healed: 1.0
  # Show "+3 Mining XP" in the action bar.
  action-bar: true
  # Blocks a player placed give no XP and no pay (no place-and-break farming).
  placed-blocks-give-nothing: true
  # Mobs from spawners give this share of the XP and pay.
  spawner-mob-factor: 0.25
  # The same player killed again within this many minutes gives nothing.
  player-kill-cooldown-minutes: 15

  # XP per block / mob / catch. Keys are Minecraft ids; '#name' is a block tag.
  xp:
    mining:
      stone: 0.2
      deepslate: 0.3
      tuff: 0.2
      granite: 0.2
      diorite: 0.2
      andesite: 0.2
      calcite: 0.3
      netherrack: 0.1
      blackstone: 0.2
      basalt: 0.2
      end_stone: 0.3
      obsidian: 2
      coal_ore: 3
      deepslate_coal_ore: 3.5
      copper_ore: 3
      deepslate_copper_ore: 3.5
      iron_ore: 5
      deepslate_iron_ore: 6
      gold_ore: 7
      deepslate_gold_ore: 8
      nether_gold_ore: 3
      redstone_ore: 4
      deepslate_redstone_ore: 5
      lapis_ore: 6
      deepslate_lapis_ore: 7
      nether_quartz_ore: 3
      diamond_ore: 18
      deepslate_diamond_ore: 20
      emerald_ore: 22
      deepslate_emerald_ore: 24
      ancient_debris: 40
      amethyst_cluster: 4
    farming:
      # fully grown crops only
      wheat: 1
      carrots: 1
      potatoes: 1
      beetroots: 1
      nether_wart: 1
      cocoa: 1
      pitcher_crop: 3
      melon: 1.5
      pumpkin: 2.5
      sugar_cane: 0.4
      cactus: 0.4
      bamboo: 0.1
      sweet_berry_bush: 1
      cave_vines: 1
      breed: 3
      shear: 1
    fishing:
      fish: 8
      treasure: 15
      junk: 3
    foraging:
      '#logs': 1.5
      mangrove_roots: 0.5
      mushroom_stem: 0.5
      brown_mushroom_block: 0.3
      red_mushroom_block: 0.3
      '#leaves': 0.05
    excavation:
      dirt: 0.3
      grass_block: 0.4
      coarse_dirt: 0.3
      rooted_dirt: 0.4
      podzol: 0.5
      mycelium: 0.5
      mud: 0.4
      sand: 0.3
      red_sand: 0.3
      gravel: 0.4
      clay: 1.5
      soul_sand: 0.5
      soul_soil: 0.5
      snow_block: 0.3
      suspicious_sand: 3
      suspicious_gravel: 3
    combat:
      zombie: 4
      husk: 4
      drowned: 5
      skeleton: 5
      stray: 5
      bogged: 5
      spider: 4
      cave_spider: 4
      creeper: 6
      enderman: 8
      witch: 8
      slime: 2
      magma_cube: 3
      phantom: 6
      pillager: 6
      vindicator: 10
      evoker: 20
      ravager: 25
      vex: 3
      blaze: 8
      ghast: 10
      wither_skeleton: 10
      piglin_brute: 12
      hoglin: 8
      zoglin: 8
      guardian: 8
      elder_guardian: 60
      shulker: 10
      breeze: 12
      silverfish: 1
      endermite: 2
      warden: 150
      wither: 120
      ender_dragon: 300
      # anything hostile not listed / passive animals / another player
      default-hostile: 4
      default-animal: 0.5
      player: 15

  # Small passive bonuses. Every one has a hard cap.
  bonuses:
    mining:
      # Mining efficiency (the same stat Efficiency adds; Efficiency I = +2,
      # Efficiency V = +26). +4 at level 50 is about one extra Efficiency level.
      efficiency-per-level: 0.08
      efficiency-cap: 4.0
      # Chance that an ore drops double.
      double-drop-per-level: 0.002
      double-drop-cap: 0.10
    farming:
      double-drop-per-level: 0.004
      double-drop-cap: 0.20
    fishing:
      # Fish bite this much sooner.
      faster-bites-per-level: 0.005
      faster-bites-cap: 0.25
      double-catch-per-level: 0.002
      double-catch-cap: 0.10
    foraging:
      # "Forager's strength": flat bonus melee damage (half of it against players).
      damage-per-level: 0.02
      damage-cap: 1.0
      double-drop-per-level: 0.003
      double-drop-cap: 0.15
    excavation:
      double-drop-per-level: 0.003
      double-drop-cap: 0.15
    combat:
      # Bonus melee and ranged damage in % (half of it against players).
      damage-percent-per-level: 0.002
      damage-percent-cap: 0.10
    vitality:
      # Extra hearts at these Vitality levels (hearts, not health points).
      hearts:
        10: 0.5
        20: 1.0
        35: 1.5
        50: 2.0

  # Manual abilities: Shift + right-click with the tool. Each unlocks at a
  # skill level and has a cooldown (seconds).
  abilities:
    haste-pulse:
      # Mining - pickaxe: Haste III for 30 seconds.
      unlock-level: 10
      seconds: 30
      amplifier: 2
      cooldown: 240
    tree-feller:
      # Foraging - axe: readies the axe; the next log you break fells the
      # whole tree. Single use.
      unlock-level: 10
      ready-seconds: 10
      max-logs: 150
      cooldown: 240
    bountiful-harvest:
      # Farming - hoe: for 30 seconds grown crops drop double and replant themselves.
      unlock-level: 10
      seconds: 30
      cooldown: 240
    lucky-cast:
      # Fishing - rod: for 60 seconds fish bite twice as fast and you get Luck.
      unlock-level: 10
      seconds: 60
      cooldown: 300
    treasure-sense:
      # Excavation - shovel: for 30 seconds digging can turn up small treasures.
      unlock-level: 10
      seconds: 30
      chance: 0.08
      cooldown: 240

# =====================================================================
#  BALANCE  - hard caps over skills AND gems together, so nothing stacks
#  into a runaway combo.
# =====================================================================
balance:
  # Nobody gets more than this many hearts from SMPSuite (vanilla is 10).
  max-hearts: 12
  # All bonus damage together (skills + gem) is at most this share of the hit.
  damage-bonus-cap-vs-mobs: 0.20
  damage-bonus-cap-vs-players: 0.08
  # Damage that gem abilities deal to players is multiplied by this.
  gem-damage-vs-players: 0.5

# =====================================================================
#  JOBS PAY  - money for the same activities that give skill XP.
#  Pay = XP * the skill's rate, +1% per skill level (max +50%).
#  Uses Vault if installed, otherwise KushCraft's wallet, otherwise off.
# =====================================================================
pay:
  enabled: true
  per-xp:
    mining: 1.6
    farming: 1.6
    fishing: 1.2
    foraging: 1.6
    excavation: 1.5
    combat: 1.0
    vitality: 0
  level-bonus-per-level: 0.01
  level-bonus-cap: 0.50
  # Most a player earns from skills in one hour (stops AFK farms). 0 = no cap.
  hourly-cap: 5000

# =====================================================================
#  BLISS GEMS  - one gem per player, held in the OFF HAND.
#  F (swap hands) = primary ability, Shift + F = secondary ability.
#  Energy 0-10: earned from normal survival play (skill XP), and a little
#  from PvP. A gem at 0 energy sleeps until you recharge it by playing.
# =====================================================================
gems:
  enabled: true
  # Give every player a random gem the first time they join.
  give-on-first-join: true
  start-energy: 5
  max-energy: 10
  # Energy needed for passives / the primary / the secondary ability.
  passive-energy: 1
  primary-energy: 2
  secondary-energy: 4
  # +1 energy for every this much skill XP you earn (all skills).
  xp-per-energy: 2000
  # PvP: the killer gains, the victim loses (the same victim again only after
  # the cooldown). Dying any other way costs nothing.
  pvp-kill-energy: 1
  pvp-death-energy: 1
  pvp-cooldown-minutes: 30
  # Energy 8+ shortens gem cooldowns a little (10% at 8, 15% at 10).
  high-energy-cooldown-bonus: true
  # /gem reroll: a random different gem for this much energy.
  reroll-cost: 5
  # Cooldowns in seconds.
  cooldowns:
    astra-primary: 45
    astra-secondary: 90
    fire-primary: 45
    fire-secondary: 120
    flux-primary: 60
    flux-secondary: 75
    life-primary: 90
    life-secondary: 60
    puff-primary: 30
    puff-secondary: 90
    speed-primary: 120
    speed-secondary: 120
    strength-primary: 90
    strength-secondary: 120
    wealth-primary: 300

# =====================================================================
#  TEAMS (parties) - opt-in groups with a colour and tag, team chat,
#  shared XP and team stats. No forced PvP: teammates can't hurt each other.
# =====================================================================
teams:
  enabled: true
  max-members: 8
  # Colour + [TAG] on name tags and in the tab list.
  name-tags: true
  # Teammates within this many blocks get this share of each other's skill XP
  # (on top - nobody loses any). 0 = off. Leaders can switch it per team.
  shared-xp: 0.10
  shared-xp-range: 48
  name-length: 16
  tag-length: 4

# =====================================================================
#  VOICE CHAT - needs the Simple Voice Chat server plugin (and the mod on
#  each player's client). Proximity voice just works; SMPSuite adds a
#  voice group for each team and the channels below.
# =====================================================================
voice:
  enabled: true
  team-groups: true
  # Public channels anyone can join with /vc join <name>.
  channels:
    - Lobby
    - Builders
    - Study

# =====================================================================
#  RESOURCE PACK - the gem textures. Without it gems still work and look
#  like plain vanilla items. url: auto = this version's pack from GitHub.
# =====================================================================
resource-pack:
  enabled: true
  url: auto
  prompt: "<aqua>Gem textures for this server</aqua> <gray>(small download)"
